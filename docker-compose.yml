services:
  generate-api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run api:generate"

  fe:
    container_name: burbot-fe
    working_dir: /app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "8001:80"
    depends_on:
      generate-api:
        condition: service_completed_successfully
    networks:
      - burbot

networks:
  burbot:
    external: true
    name: burbot